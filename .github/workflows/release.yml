name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          TIDES_SIGNING_KEYSTORE_BASE64: ${{ secrets.TIDES_SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$TIDES_SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::TIDES_SIGNING_KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          echo "$TIDES_SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "TIDES_SIGNING_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          TIDES_SIGNING_STORE_PASSWORD: ${{ secrets.TIDES_SIGNING_STORE_PASSWORD }}
          TIDES_SIGNING_KEY_ALIAS: ${{ secrets.TIDES_SIGNING_KEY_ALIAS }}
          TIDES_SIGNING_KEY_PASSWORD: ${{ secrets.TIDES_SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Verify release APK declares no network permissions
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Auditing $APK"
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n 1)
          "$AAPT2" dump permissions "$APK" > perms.txt
          cat perms.txt
          if grep -q "android.permission.INTERNET" perms.txt; then
            echo "::error::INTERNET permission found in release APK"
            exit 1
          fi
          if grep -q "android.permission.ACCESS_NETWORK_STATE" perms.txt; then
            echo "::error::ACCESS_NETWORK_STATE found in release APK"
            exit 1
          fi
          echo "OK: release APK declares no network permissions"

      - name: Stage APK with predictable name
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          VERSION=${GITHUB_REF_NAME#v}
          cp "$APK" "tides-${VERSION}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: tides-*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
