name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Nightly run catches flakes between commits and keeps the cached AVD warm.
  schedule:
    - cron: '17 6 * * *'  # 06:17 UTC daily
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Verify APK declares no network permissions
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Auditing $APK"
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n 1)
          if [ -z "$AAPT2" ]; then
            echo "::error::aapt2 not found under $ANDROID_HOME/build-tools"
            exit 1
          fi
          echo "Using $AAPT2"
          "$AAPT2" dump permissions "$APK" > perms.txt
          cat perms.txt
          if grep -q "android.permission.INTERNET" perms.txt; then
            echo "::error::INTERNET permission found in APK"
            exit 1
          fi
          if grep -q "android.permission.ACCESS_NETWORK_STATE" perms.txt; then
            echo "::error::ACCESS_NETWORK_STATE found in APK"
            exit 1
          fi
          echo "OK: no network permissions"

  instrumented-tests:
    runs-on: ubuntu-latest
    # Run on push to main, nightly schedule, and manual dispatch.
    # Skipped on PRs to keep PR turnaround fast; flakes here block the merge,
    # not the PR review cycle.
    if: github.event_name != 'pull_request'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: gradle/actions/setup-gradle@v4

      # Cache the booted AVD so subsequent runs skip the cold-boot phase that
      # was the dominant flake source — "Failed to start Emulator console for
      # 5554" appeared in roughly every cold-boot run.
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api34-google_apis-x86_64-v1

      # First-time AVD provisioning: create the image, boot it once so its
      # snapshot is saved into the cache for subsequent runs.
      - name: Create + warm AVD snapshot (cache miss only)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD created and snapshot saved"

      # Real test run. disable-animations: true fixes the "Failed to inject
      # touch input" failures in Compose UI tests (animations swallow taps on
      # CI emulators). -no-snapshot-save keeps the cached snapshot pristine.
      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            # Brief boot-completion gate before tests touch the DB. SQLCipher
            # native libs occasionally race with the package manager during
            # cold start; this also helps SAF/file APIs settle.
            adb wait-for-device
            adb shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done; echo "boot complete"'
            adb shell input keyevent 82 || true  # unlock if a lock screen appeared
            ./gradlew :app:connectedDebugAndroidTest

      - name: Upload instrumented-test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: androidTest-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 14
