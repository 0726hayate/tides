<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Direction 2 CVD-safe</title>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #f1ece4;
    font-family: 'Google Sans', 'Roboto', sans-serif;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
    color: #1d1b16;
  }
  .phone {
    width: 390px;
    background: #faf5ec;
    border-radius: 44px;
    padding: 14px;
    box-shadow: 0 30px 80px rgba(60,40,20,0.18);
  }
  .screen {
    background: #faf5ec;
    border-radius: 32px;
    overflow: hidden;
    height: 760px;
    padding: 28px 24px 0;
  }
  .status-bar {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: #6b6354;
    font-weight: 500;
    margin-bottom: 28px;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 28px;
  }
  .month {
    font-size: 28px;
    font-weight: 500;
    letter-spacing: -0.01em;
    color: #1d1b16;
  }
  .month .year {
    color: #8a8270;
    font-weight: 400;
  }
  .icons {
    display: flex;
    gap: 16px;
    color: #6b6354;
    font-size: 18px;
  }
  .cycle-summary {
    margin-bottom: 28px;
    padding: 20px 22px;
    background: #ebe1cc;
    border-radius: 24px;
  }
  .cycle-day {
    font-size: 44px;
    font-weight: 500;
    color: #1d1b16;
    line-height: 1;
  }
  .cycle-day .label {
    font-size: 13px;
    font-weight: 500;
    color: #6b6354;
    display: block;
    margin-bottom: 8px;
  }
  .prediction {
    font-size: 14px;
    color: #4a4233;
    margin-top: 14px;
  }
  .prediction .accent { color: #87502d; font-weight: 500; }
  .weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    margin-bottom: 8px;
  }
  .weekday {
    text-align: center;
    font-size: 12px;
    font-weight: 500;
    color: #8a8270;
    padding: 6px 0;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .day {
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    color: #1d1b16;
    font-weight: 400;
    border-radius: 50%;
    position: relative;
  }
  .day.muted { color: #c7bda6; }
  .day.today {
    background: #1d1b16;
    color: #faf5ec;
    font-weight: 500;
  }
  /* Period: solid fill + drop glyph inside (shape encodes meaning, not just color) */
  .day.period {
    background: #c25a3a;
    color: #faf5ec;
    font-weight: 600;
    position: relative;
  }
  .day.period::after {
    content: '';
    position: absolute;
    top: 5px;
    right: 6px;
    width: 6px;
    height: 6px;
    background: #faf5ec;
    border-radius: 0 50% 50% 50%;
    transform: rotate(-45deg);
  }
  /* Predicted: NO ring around the date. Use a separate band underneath. */
  .day .symptom-dot {
    position: absolute;
    bottom: 6px;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #8a8270;
  }
  /* Range band: a continuous bar drawn underneath the predicted week */
  .range-band-wrap {
    position: relative;
    height: 0;
    margin-top: 4px;
  }
  .range-band {
    position: absolute;
    top: -22px; /* sits below last calendar row */
    height: 6px;
    background: repeating-linear-gradient(90deg, #c25a3a 0 6px, transparent 6px 10px);
    border-radius: 3px;
  }
  .range-band-label {
    position: absolute;
    top: -16px;
    font-size: 10px;
    font-weight: 600;
    color: #87502d;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .legend {
    margin-top: 56px;
    display: flex;
    gap: 16px;
    font-size: 11px;
    color: #6b6354;
    flex-wrap: wrap;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .legend-swatch {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    position: relative;
  }
  .legend-swatch.period {
    background: #c25a3a;
  }
  .legend-swatch.period::after {
    content: '';
    position: absolute;
    top: 3px;
    right: 3px;
    width: 4px;
    height: 4px;
    background: #faf5ec;
    border-radius: 0 50% 50% 50%;
    transform: rotate(-45deg);
  }
  .legend-swatch.predicted {
    border-radius: 0;
    width: 14px;
    height: 6px;
    background: repeating-linear-gradient(90deg, #c25a3a 0 4px, transparent 4px 7px);
  }
  .legend-swatch.symptom { position: relative; }
  .legend-swatch.symptom::after {
    content: ''; position: absolute; left: 5px; top: 5px;
    width: 4px; height: 4px; border-radius: 50%; background: #8a8270;
  }
  .fab {
    position: absolute;
    bottom: 32px;
    right: 24px;
    width: 56px;
    height: 56px;
    background: #c25a3a;
    color: #faf5ec;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: 300;
    box-shadow: 0 4px 16px rgba(194,90,58,0.3);
  }
  .container { position: relative; }
</style>
</head>
<body>
<div class="container">
  <div class="phone">
    <div class="screen">
      <div class="status-bar">
        <span>9:41</span>
        <span>● ● ●</span>
      </div>
      <div class="header">
        <div class="month">May <span class="year">2026</span></div>
        <div class="icons">⌕ ⚙</div>
      </div>
      <div class="cycle-summary">
        <span class="label">Cycle day</span>
        <div class="cycle-day">14</div>
        <div class="prediction">Period likely <span class="accent">May 28 – Jun 1</span></div>
      </div>
      <div class="weekdays">
        <div class="weekday">M</div><div class="weekday">T</div><div class="weekday">W</div>
        <div class="weekday">T</div><div class="weekday">F</div><div class="weekday">S</div><div class="weekday">S</div>
      </div>
      <div class="grid">
        <div class="day muted">28</div><div class="day muted">29</div><div class="day muted">30</div>
        <div class="day period">1</div><div class="day period">2</div><div class="day period">3</div><div class="day period">4</div>
        <div class="day">5</div><div class="day">6</div><div class="day">7<div class="symptom-dot"></div></div><div class="day">8</div><div class="day">9</div><div class="day">10<div class="symptom-dot"></div></div><div class="day">11</div>
        <div class="day">12</div><div class="day">13</div><div class="day today">14</div><div class="day">15<div class="symptom-dot"></div></div><div class="day">16</div><div class="day">17</div><div class="day">18</div>
        <div class="day">19</div><div class="day">20</div><div class="day">21</div><div class="day">22</div><div class="day">23</div><div class="day">24</div><div class="day">25</div>
        <div class="day">26</div><div class="day">27</div><div class="day">28</div><div class="day">29</div><div class="day">30</div><div class="day">31</div><div class="day muted">1</div>
      </div>
      <div class="range-band-wrap">
        <div class="range-band-label" style="left: 28.5%;">predicted</div>
        <div class="range-band" style="left: 28.5%; width: 70%;"></div>
      </div>
      <div class="legend">
        <div class="legend-item"><div class="legend-swatch period"></div>Period</div>
        <div class="legend-item"><div class="legend-swatch predicted"></div>Predicted range</div>
        <div class="legend-item"><div class="legend-swatch symptom"></div>Symptom logged</div>
      </div>
    </div>
  </div>
  <div class="fab">+</div>
</div>
</body>
</html>
