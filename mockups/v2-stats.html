<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stats — Light</title>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #f1ece4;
    font-family: 'Google Sans', 'Roboto', sans-serif;
    display: flex; justify-content: center; padding: 40px 20px;
    color: #1d1b16;
  }
  .phone {
    width: 390px; background: #faf5ec;
    border-radius: 44px; padding: 14px;
    box-shadow: 0 30px 80px rgba(60,40,20,0.18);
  }
  .screen {
    background: #faf5ec; border-radius: 32px; overflow: hidden;
    height: 820px; padding: 28px 24px;
  }
  .status-bar {
    display: flex; justify-content: space-between;
    font-size: 13px; color: #6b6354; font-weight: 500; margin-bottom: 22px;
  }
  .header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 22px;
  }
  .title { font-size: 26px; font-weight: 500; }
  .range-pills { display: flex; gap: 6px; margin-bottom: 22px; }
  .range-pill {
    padding: 6px 12px; border-radius: 999px;
    font-size: 12px; font-weight: 500;
    background: transparent; border: 1.5px solid #d6cab0;
    color: #6b6354;
  }
  .range-pill.selected { background: #1d1b16; color: #faf5ec; border-color: #1d1b16; }

  .summary-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 10px; margin-bottom: 24px;
  }
  .summary-card {
    padding: 16px 18px; background: #ebe1cc; border-radius: 18px;
  }
  .summary-card .label { font-size: 11px; font-weight: 600; color: #6b6354; text-transform: uppercase; letter-spacing: 0.08em; }
  .summary-card .val { font-size: 28px; font-weight: 500; color: #1d1b16; line-height: 1.1; margin-top: 6px; }
  .summary-card .val .unit { font-size: 12px; color: #8a8270; font-weight: 400; }
  .summary-card .delta { font-size: 11px; color: #87502d; margin-top: 4px; }

  .chart-section { margin-bottom: 22px; }
  .chart-label { font-size: 11px; font-weight: 600; color: #6b6354; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px; }
  .chart {
    display: flex; align-items: flex-end; gap: 4px;
    height: 110px;
    padding-bottom: 4px;
    border-bottom: 1px solid #d6cab0;
  }
  .bar {
    flex: 1;
    background: #c25a3a;
    border-radius: 4px 4px 0 0;
    position: relative;
    display: flex; align-items: flex-end; justify-content: center;
    color: #faf5ec; font-size: 9px; font-weight: 600;
    padding-bottom: 4px;
  }
  .bar.muted { background: #d6cab0; color: #4a4233; }
  .chart-x {
    display: flex; gap: 4px; margin-top: 6px;
    font-size: 10px; color: #8a8270;
  }
  .chart-x span { flex: 1; text-align: center; }
  .chart-avg-line {
    position: relative; height: 0;
  }
  .chart-avg-line .line {
    position: absolute; left: 0; right: 0;
    border-top: 1px dashed #87502d;
  }
  .chart-avg-line .label {
    position: absolute; right: 0; top: -16px;
    font-size: 10px; font-weight: 600; color: #87502d;
    background: #faf5ec; padding: 0 4px;
  }

  .symptom-frequency {
    margin-top: 22px;
  }
  .symptom-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid #ebe1cc;
  }
  .symptom-row .name { width: 90px; font-size: 13px; color: #1d1b16; }
  .symptom-row .bar-wrap { flex: 1; height: 8px; background: #ebe1cc; border-radius: 4px; overflow: hidden; }
  .symptom-row .bar-fill { height: 100%; background: #1d1b16; border-radius: 4px; }
  .symptom-row .count { font-size: 11px; color: #8a8270; font-variant-numeric: tabular-nums; width: 30px; text-align: right; }

  .export-row {
    margin-top: 24px;
    display: flex; gap: 10px;
  }
  .btn {
    flex: 1; padding: 12px;
    border-radius: 12px;
    font-size: 13px; font-weight: 600;
    text-align: center;
    border: 1.5px solid #d6cab0;
    background: transparent;
    color: #1d1b16;
  }
</style>
</head>
<body>
<div class="phone">
  <div class="screen">
    <div class="status-bar"><span>9:41</span><span>● ● ●</span></div>
    <div class="header">
      <div class="title">Insights</div>
      <div style="color:#6b6354; font-size:18px;">⤓</div>
    </div>

    <div class="range-pills">
      <div class="range-pill">3 mo</div>
      <div class="range-pill selected">6 mo</div>
      <div class="range-pill">1 yr</div>
      <div class="range-pill">All</div>
    </div>

    <div class="summary-grid">
      <div class="summary-card">
        <div class="label">Avg cycle</div>
        <div class="val">28 <span class="unit">days</span></div>
        <div class="delta">±2 day variance</div>
      </div>
      <div class="summary-card">
        <div class="label">Avg period</div>
        <div class="val">4.5 <span class="unit">days</span></div>
        <div class="delta">stable</div>
      </div>
    </div>

    <div class="chart-section">
      <div class="chart-label">Cycle length — last 6</div>
      <div class="chart">
        <div class="bar" style="height: 75%">28</div>
        <div class="bar" style="height: 70%">27</div>
        <div class="bar" style="height: 80%">29</div>
        <div class="bar" style="height: 75%">28</div>
        <div class="bar" style="height: 70%">27</div>
        <div class="bar muted" style="height: 78%">28*</div>
      </div>
      <div class="chart-x">
        <span>Dec</span><span>Jan</span><span>Feb</span><span>Mar</span><span>Apr</span><span>May</span>
      </div>
    </div>

    <div class="symptom-frequency">
      <div class="chart-label">Top symptoms</div>
      <div class="symptom-row">
        <div class="name">Cramps</div>
        <div class="bar-wrap"><div class="bar-fill" style="width: 82%"></div></div>
        <div class="count">14</div>
      </div>
      <div class="symptom-row">
        <div class="name">Headache</div>
        <div class="bar-wrap"><div class="bar-fill" style="width: 60%"></div></div>
        <div class="count">10</div>
      </div>
      <div class="symptom-row">
        <div class="name">Bloating</div>
        <div class="bar-wrap"><div class="bar-fill" style="width: 48%"></div></div>
        <div class="count">8</div>
      </div>
      <div class="symptom-row">
        <div class="name">Fatigue</div>
        <div class="bar-wrap"><div class="bar-fill" style="width: 35%"></div></div>
        <div class="count">6</div>
      </div>
    </div>

    <div class="export-row">
      <div class="btn">Export PDF</div>
      <div class="btn">Export CSV</div>
    </div>
  </div>
</div>
</body>
</html>
