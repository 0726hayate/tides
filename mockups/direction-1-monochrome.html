<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Direction 1: Monochrome Dark</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #18181b;
    font-family: 'Inter', sans-serif;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
    color: #e4e4e7;
  }
  .phone {
    width: 390px;
    background: #0a0a0a;
    border-radius: 44px;
    padding: 14px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
  }
  .screen {
    background: #0a0a0a;
    border-radius: 32px;
    overflow: hidden;
    height: 760px;
    padding: 28px 24px 0;
  }
  .status-bar {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: #71717a;
    font-weight: 500;
    margin-bottom: 28px;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 32px;
  }
  .month {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: #fafafa;
  }
  .month .year {
    color: #52525b;
    font-weight: 500;
  }
  .icons {
    display: flex;
    gap: 16px;
    color: #71717a;
    font-size: 18px;
  }
  .cycle-summary {
    margin-bottom: 28px;
    padding: 18px 20px;
    border: 1px solid #27272a;
    border-radius: 16px;
  }
  .cycle-day {
    font-size: 48px;
    font-weight: 700;
    letter-spacing: -0.04em;
    color: #fafafa;
    line-height: 1;
  }
  .cycle-day .label {
    font-size: 13px;
    font-weight: 500;
    color: #71717a;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    display: block;
    margin-bottom: 6px;
  }
  .prediction {
    font-size: 14px;
    color: #a1a1aa;
    margin-top: 12px;
  }
  .prediction .red-text { color: #e57373; font-weight: 500; }
  .weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 0;
    margin-bottom: 8px;
  }
  .weekday {
    text-align: center;
    font-size: 11px;
    font-weight: 600;
    color: #52525b;
    letter-spacing: 0.06em;
    padding: 6px 0;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .day {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    color: #d4d4d8;
    font-weight: 500;
    border-radius: 50%;
    position: relative;
  }
  .day.muted { color: #3f3f46; }
  .day.today {
    border: 1.5px solid #fafafa;
    color: #fafafa;
    font-weight: 600;
  }
  .day.period {
    background: #b8413a;
    color: #fef2f2;
    font-weight: 600;
  }
  .day.predicted {
    border: 1.5px dashed #b8413a;
    color: #e57373;
  }
  .day .dot {
    position: absolute;
    bottom: 6px;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #71717a;
  }
  .legend {
    margin-top: 32px;
    display: flex;
    gap: 16px;
    font-size: 11px;
    color: #71717a;
    flex-wrap: wrap;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .legend-swatch {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }
  .legend-swatch.period { background: #b8413a; }
  .legend-swatch.predicted { border: 1.5px dashed #b8413a; }
  .legend-swatch.symptom {
    background: transparent;
    position: relative;
  }
  .legend-swatch.symptom::after {
    content: ''; position: absolute; left: 3px; top: 3px;
    width: 4px; height: 4px; border-radius: 50%; background: #71717a;
  }
  .fab {
    position: absolute;
    bottom: 32px;
    right: 24px;
    width: 56px;
    height: 56px;
    background: #fafafa;
    color: #0a0a0a;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: 300;
  }
  .container { position: relative; }
</style>
</head>
<body>
<div class="container">
  <div class="phone">
    <div class="screen">
      <div class="status-bar">
        <span>9:41</span>
        <span>● ● ●</span>
      </div>
      <div class="header">
        <div class="month">May <span class="year">2026</span></div>
        <div class="icons">⌕ ⚙</div>
      </div>
      <div class="cycle-summary">
        <span class="label">CYCLE DAY</span>
        <div class="cycle-day">14</div>
        <div class="prediction">Period likely <span class="red-text">May 28 – Jun 1</span></div>
      </div>
      <div class="weekdays">
        <div class="weekday">M</div><div class="weekday">T</div><div class="weekday">W</div>
        <div class="weekday">T</div><div class="weekday">F</div><div class="weekday">S</div><div class="weekday">S</div>
      </div>
      <div class="grid">
        <div class="day muted">28</div><div class="day muted">29</div><div class="day muted">30</div>
        <div class="day period">1</div><div class="day period">2</div><div class="day period">3</div><div class="day period">4</div>
        <div class="day">5</div><div class="day">6</div><div class="day">7<div class="dot"></div></div><div class="day">8</div><div class="day">9</div><div class="day">10<div class="dot"></div></div><div class="day">11</div>
        <div class="day">12</div><div class="day">13</div><div class="day today">14</div><div class="day">15<div class="dot"></div></div><div class="day">16</div><div class="day">17</div><div class="day">18</div>
        <div class="day">19</div><div class="day">20</div><div class="day">21</div><div class="day">22</div><div class="day">23</div><div class="day">24</div><div class="day">25</div>
        <div class="day">26</div><div class="day">27</div><div class="day predicted">28</div><div class="day predicted">29</div><div class="day predicted">30</div><div class="day predicted">31</div><div class="day muted predicted">1</div>
      </div>
      <div class="legend">
        <div class="legend-item"><div class="legend-swatch period"></div>Period</div>
        <div class="legend-item"><div class="legend-swatch predicted"></div>Predicted range</div>
        <div class="legend-item"><div class="legend-swatch symptom"></div>Symptom logged</div>
      </div>
    </div>
  </div>
  <div class="fab">+</div>
</div>
</body>
</html>
