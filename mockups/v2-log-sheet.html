<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Log bottom sheet — Light</title>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #f1ece4;
    font-family: 'Google Sans', 'Roboto', sans-serif;
    display: flex; justify-content: center; padding: 40px 20px;
    color: #1d1b16;
  }
  .phone {
    width: 390px; background: #faf5ec;
    border-radius: 44px; padding: 14px;
    box-shadow: 0 30px 80px rgba(60,40,20,0.18);
    position: relative;
    overflow: hidden;
  }
  .screen {
    background: #faf5ec;
    border-radius: 32px;
    height: 820px;
    position: relative;
    overflow: hidden;
  }
  /* Dimmed calendar peeking through behind the sheet */
  .behind {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 24px;
    color: #1d1b16;
  }
  .behind .status-bar {
    display: flex; justify-content: space-between;
    font-size: 13px; color: #6b6354; font-weight: 500;
    margin-bottom: 22px;
  }
  .behind .month-row {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 18px;
  }
  .behind .month { font-size: 24px; font-weight: 500; }
  .behind .month .year { color: #8a8270; font-weight: 400; }
  .behind .icons { color: #6b6354; font-size: 16px; }
  .behind .mini-cal {
    background: #ebe1cc; border-radius: 18px; padding: 14px; opacity: 0.55;
  }
  .behind .mini-row {
    display: flex; gap: 6px; margin-bottom: 6px;
    font-size: 11px; color: #6b6354;
  }
  .behind .mini-row .d { flex: 1; text-align: center; padding: 4px 0; border-radius: 50%; aspect-ratio: 1; }
  .behind .mini-row .d.p { background: #c25a3a; color: #faf5ec; }
  .behind .mini-row .d.t { background: #1d1b16; color: #faf5ec; }
  .scrim {
    position: absolute; inset: 0;
    background: rgba(29,27,22,0.35);
  }
  .sheet {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: #faf5ec;
    border-radius: 28px 28px 0 0;
    padding: 14px 24px 22px;
    box-shadow: 0 -12px 40px rgba(0,0,0,0.2);
    max-height: 88%;
    overflow: hidden;
  }
  .grabber {
    width: 36px; height: 4px;
    background: #c7bda6; border-radius: 2px;
    margin: 0 auto 18px;
  }
  .sheet-header {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 4px;
  }
  .sheet-date {
    font-size: 22px; font-weight: 500; color: #1d1b16;
  }
  .sheet-cycle {
    font-size: 12px; color: #8a8270;
  }
  .section-label {
    font-size: 11px; font-weight: 600; color: #6b6354;
    text-transform: uppercase; letter-spacing: 0.1em;
    margin: 16px 0 10px;
  }

  .flow-pills { display: flex; gap: 8px; flex-wrap: wrap; }
  .flow-pill {
    padding: 10px 14px;
    border: 1.5px solid #d6cab0;
    border-radius: 999px;
    font-size: 13px; font-weight: 500;
    color: #4a4233;
    background: transparent;
    display: flex; align-items: center; gap: 6px;
  }
  .flow-pill.selected {
    background: #c25a3a; color: #faf5ec; border-color: #c25a3a;
  }
  .flow-pill .glyph {
    width: 8px; height: 8px; background: currentColor;
    border-radius: 0 50% 50% 50%; transform: rotate(-45deg);
    opacity: 0.6;
  }
  .flow-pill.spotting .glyph { opacity: 0.3; }
  .flow-pill.light .glyph { opacity: 0.55; }
  .flow-pill.medium .glyph { opacity: 0.75; }
  .flow-pill.heavy .glyph { opacity: 1; }
  .flow-pill .glyph-group { display: inline-flex; gap: 1px; }

  .symptoms { display: flex; flex-wrap: wrap; gap: 8px; }
  .symptom-chip {
    padding: 10px 14px;
    background: #ebe1cc;
    border-radius: 999px;
    font-size: 13px; font-weight: 500;
    color: #4a4233;
    display: flex; align-items: center; gap: 8px;
  }
  .symptom-chip.selected {
    background: #1d1b16; color: #faf5ec;
  }
  .symptom-chip .sev {
    background: rgba(255,255,255,0.2);
    padding: 2px 6px; border-radius: 4px;
    font-size: 10px; font-weight: 600;
  }
  .symptom-chip.selected .sev { background: rgba(255,255,255,0.2); }

  .notes-field {
    margin-top: 4px;
    padding: 10px 14px;
    background: #ebe1cc;
    border-radius: 14px;
    font-size: 13px;
    color: #8a8270;
    min-height: 44px;
  }
  .notes-field.filled { color: #1d1b16; }

  .save-row {
    margin-top: 18px;
    display: flex; gap: 12px;
  }
  .btn {
    flex: 1; padding: 12px;
    border-radius: 999px;
    font-size: 14px; font-weight: 600;
    text-align: center;
    border: none;
  }
  .btn.primary { background: #1d1b16; color: #faf5ec; }
  .btn.secondary { background: transparent; color: #1d1b16; border: 1.5px solid #d6cab0; }
</style>
</head>
<body>
<div class="phone">
  <div class="screen">
    <div class="behind">
      <div class="status-bar"><span>9:41</span><span>● ● ●</span></div>
      <div class="month-row">
        <div class="month">May <span class="year">2026</span></div>
        <div class="icons">⌕ ⚙</div>
      </div>
      <div class="mini-cal">
        <div class="mini-row">
          <div class="d">M</div><div class="d">T</div><div class="d">W</div>
          <div class="d">T</div><div class="d">F</div><div class="d">S</div><div class="d">S</div>
        </div>
        <div class="mini-row">
          <div class="d"></div><div class="d"></div><div class="d"></div>
          <div class="d p">1</div><div class="d p">2</div><div class="d p">3</div><div class="d p">4</div>
        </div>
        <div class="mini-row">
          <div class="d">5</div><div class="d">6</div><div class="d">7</div>
          <div class="d">8</div><div class="d">9</div><div class="d">10</div><div class="d">11</div>
        </div>
        <div class="mini-row">
          <div class="d">12</div><div class="d">13</div><div class="d t">14</div>
          <div class="d">15</div><div class="d">16</div><div class="d">17</div><div class="d">18</div>
        </div>
      </div>
    </div>
    <div class="scrim"></div>
    <div class="sheet">
      <div class="grabber"></div>
      <div class="sheet-header">
        <div class="sheet-date">Thursday, May 14</div>
        <div class="sheet-cycle">Cycle day 14</div>
      </div>

      <div class="section-label">Flow</div>
      <div class="flow-pills">
        <div class="flow-pill">None</div>
        <div class="flow-pill spotting">Spotting <span class="glyph-group"><span class="glyph"></span></span></div>
        <div class="flow-pill light">Light <span class="glyph-group"><span class="glyph"></span></span></div>
        <div class="flow-pill medium selected">Medium <span class="glyph-group"><span class="glyph"></span><span class="glyph"></span></span></div>
        <div class="flow-pill heavy">Heavy <span class="glyph-group"><span class="glyph"></span><span class="glyph"></span><span class="glyph"></span></span></div>
      </div>

      <div class="section-label">Symptoms</div>
      <div class="symptoms">
        <div class="symptom-chip selected">Cramps <span class="sev">mild</span></div>
        <div class="symptom-chip selected">Headache <span class="sev">moderate</span></div>
        <div class="symptom-chip">Bloating</div>
        <div class="symptom-chip">Fatigue</div>
        <div class="symptom-chip">Back pain</div>
        <div class="symptom-chip">Nausea</div>
        <div class="symptom-chip">Tender breasts</div>
        <div class="symptom-chip">+ Add</div>
      </div>

      <div class="section-label">Note</div>
      <div class="notes-field">Optional — anything else worth remembering</div>

      <div class="save-row">
        <button class="btn secondary">Cancel</button>
        <button class="btn primary">Save</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
